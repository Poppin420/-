appId: gr.synergeio.app
productName: Synergeio
# No asar, so the embedded database (WASM) and server run as plain files.
asar: false
directories:
  output: dist-desktop
  buildResources: electron/resources
files:
  - electron/**
  - web/dist/**
  - package.json
  - "!**/*.map"
win:
  target: nsis
  artifactName: Synergeio-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Συνεργείο
