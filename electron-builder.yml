appId: gr.synergeio.app
productName: Synergeio
# No asar, so the embedded database (WASM) and server run as plain files.
asar: false
directories:
  output: dist-desktop
  buildResources: electron/resources
files:
  - electron/**
  - web/dist/**
  - package.json
  - "!**/*.map"
win:
  # 32-bit (ia32) so it runs on older 32-bit Windows 10 — and on 64-bit too.
  target:
    - target: nsis
      arch:
        - ia32
  artifactName: Synergeio-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Συνεργείο
